        currentIO = new IntersectionObserver(function(entries){
          var best = null, bestRatio = 0;
          entries.forEach(function(e){ if (e.isIntersecting && e.intersectionRatio > bestRatio) { bestRatio = e.intersectionRatio; best = e.target; } });
          if (best && bestRatio > 0.55) {
            var idx = slides.indexOf(best);
            if (idx !== -1 && idx !== currentIndex) {
              flushDwell(currentIndex);
              currentIndex = idx;
              slideEnteredAt = Date.now();
              setActiveSlide(idx);
            }
          }
        }, { root: feed, threshold: [0.1, 0.55, 0.9] });
        slides.forEach(function(s){ currentIO.observe(s); });
      }

      var slideIO = null;
      function initSlideViewsIO(){
        if (slideIO) slideIO.disconnect();
        slideIO = new IntersectionObserver(function(entries){
          entries.forEach(function(e){
            if (e.isIntersecting && e.intersectionRatio > 0.5) {
              var slideId = e.target.dataset.id;
              if (slideId && !trackedSlideViews[slideId]) { trackedSlideViews[slideId] = true; trackEvent('slide_view', { slide_id: slideId }); }
            }
          });
        }, { root: feed, threshold: [0, 0.55, 0.9] });
        slides.forEach(function(s){ slideIO.observe(s); });
      }

      function bootFeed(){
        if (feedBooted) return;
        if (!slides.length) return;
        feedBooted = true;
        feed.classList.add('visible');
        layoutReels();
        initIO();
        initSlideViewsIO();
        initViewerCounters();
        setActiveSlide(0);
        refreshTopUI();
        loadMyVotes();
      }

      async function loadMyVotes(){
        try {
          var user = await authReady; if (!user) return;
          try {
            var mine = await supabaseClient.from('likes').select('slide_id').eq('user_id', user.id);
            if (mine && mine.data) mine.data.forEach(function(r){ if (r.slide_id) myTopSlides[r.slide_id] = true; });
          } catch(e){}
          refreshTopUI();
        } catch(e){}
      }

      function copyToClipboard(text){
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
        return new Promise(function(resolve, reject){
          try {
            var ta = document.createElement('textarea');
            ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'absolute'; ta.style.left = '-9999px';
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); resolve();
          } catch(e){ reject(e); }
        });
      }

      var STORAGE_KEY = EARLY_TG_ID ? 'sb-rlkjsjgktyltvxnfyski-auth-token-' + EARLY_TG_ID : 'sb-rlkjsjgktyltvxnfyski-auth-token';
      var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true, storageKey: STORAGE_KEY } });

      function readTgId(){ var u = readTgUser(); return u ? String(u.id) : null; }
      function getAnonId(){
        var key = EARLY_TG_ID ? 'vetka_anon_id_' + EARLY_TG_ID : 'vetka_anon_id';
        var id = null; try { id = localStorage.getItem(key); } catch(e){}
        if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : 'anon-' + Date.now()); try { localStorage.setItem(key, id); } catch(e){} }
        return id;
      }

      var authReady = (async function(){
        var hasStored = false; try { hasStored = !!localStorage.getItem(STORAGE_KEY); } catch(e){}
        if (hasStored) {
          for (var i = 0; i < 15; i++) {
            try { var s = await supabaseClient.auth.getSession(); if (s.data && s.data.session && s.data.session.user) return s.data.session.user; } catch(e){}
            await new Promise(function(r){ setTimeout(r, 200); });
          }
        }
        try { var r = await supabaseClient.auth.signInAnonymously(); if (r.error) return null; return r.data.user; }
        catch(e){ return null; }
      })();

      function startTgIdWatch(){
        if (tgIdWatchStarted) return;
        tgIdWatchStarted = true;
        var tries = 0;
        var iv = setInterval(function(){
          tries++;
          if (readTgId()) { clearInterval(iv); flushEvents(); }
          else if (tries >= 25) { clearInterval(iv); flushEvents(); }
        }, 200);
        setTimeout(flushEvents, 5200);
      }

      async function flushEvents(){
        if (flushing) return;
        if (pendingEvents.length === 0) return;
        flushing = true;
        var batch = pendingEvents.slice(); pendingEvents = [];
        try {
          var user = await authReady; if (!user) { flushing = false; return; }
          var tgId = readTgId(); var anonId = getAnonId();
          var rows = batch.map(function(e){ return { user_id: user.id, tg_id: tgId, anon_id: anonId, event_type: e.type, event_data: e.data, session_id: SESSION_ID }; });
          await supabaseClient.from('events').insert(rows);
        } catch(e){}
        flushing = false;
        if (pendingEvents.length > 0) flushEvents();
      }

      function scheduleFlush(){ if (flushTimer) return; flushTimer = setTimeout(function(){ flushTimer = null; flushEvents(); }, 1500); }
      function trackEvent(type, data){
        pendingEvents.push({ type: type, data: data || {} });
        if (readTgId()) scheduleFlush();
        else if (window.Telegram && window.Telegram.WebApp) startTgIdWatch();
        else scheduleFlush();
      }

      function flushDwell(idx){
        if (idx < 0 || idx >= slides.length) return;
        if (!slideEnteredAt) return;
        var dur = Date.now() - slideEnteredAt;
        slideEnteredAt = 0;
        if (dur < 500 || dur > 30 * 60 * 1000) return;
        var slideId = slides[idx].dataset.id;
        if (slideId) trackEvent('slide_dwell', { slide_id: slideId, duration_ms: dur });
      }

      document.addEventListener('visibilitychange', function(){
        if (document.hidden) { flushDwell(currentIndex); flushEvents(); } else { slideEnteredAt = Date.now(); }
      });
      window.addEventListener('pagehide', function(){ flushDwell(currentIndex); flushEvents(); });
      window.addEventListener('resize', layoutReels);

      authReady.then(function(u){
        if (!u) return;
        trackEvent('visit', { referrer: document.referrer || null, ua: navigator.userAgent });
        setTimeout(function(){ trackEvent('visit', {}); }, 5000);
      });

      loadReels();
    })();
  </script>
