      function pad2(n){ return (n < 10 ? '0' : '') + n; }
      function formatDateShort(d){
        var locMap = { ru: 'ru-RU', en: 'en-US', es: 'es-ES' };
        try { return d.toLocaleDateString(locMap[currentLang] || 'ru-RU', { day: 'numeric', month: 'short' }); }
        catch(e){ return d.getDate() + '.' + (d.getMonth() + 1); }
      }
      function formatStartsAt(iso){
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        var now = new Date();
        var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        var eventDayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        var diffDays = Math.round((eventDayStart - todayStart) / 86400000);
        var time = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        if (diffDays === 0) return tFmt('soon_today', { time: time });
        if (diffDays === 1) return tFmt('soon_tomorrow', { time: time });
        return tFmt('soon_date', { date: formatDateShort(d) });
      }

      function getBadgeState(reel){
        if (!reel || !reel.event_starts_at) return 'hidden';
        var start = new Date(reel.event_starts_at).getTime();
        if (isNaN(start)) return 'hidden';
        var end = reel.event_ends_at ? new Date(reel.event_ends_at).getTime() : null;
        if (end !== null && isNaN(end)) end = null;
        var now = Date.now();
        if (end !== null && now > end) return 'hidden';
        if (now >= start) {
          if (end === null) return 'live';
          if (now <= end) return 'live';
          return 'hidden';
        }
        var untilStart = start - now;
        if (untilStart <= 48 * 3600 * 1000) return 'soon';
        return 'hidden';
      }

          if (doorBadge) doorBadge.textContent = '✦ Пусто';

        currentIndex = 0;
        slideEnteredAt = Date.now();
        if (currentIO) { currentIO.disconnect(); currentIO = null; }
        if (slideIO) { slideIO.disconnect(); slideIO = null; }
        initIO();
        initSlideViewsIO();
        setActiveSlide(0);
        currentView = 'door';
      }

      function refreshLiveLabels(){
        slides.forEach(function(slide){
          if (slide.dataset.past === '1') return;
          var live = slide.querySelector('.live-top');
          if (!live) return;
          var startsAt = live.getAttribute('data-starts-at');
          var endsAt = live.getAttribute('data-ends-at');
          if (!startsAt) return;
          var fakeReel = { event_starts_at: startsAt, event_ends_at: endsAt || null };
          var state = getBadgeState(fakeReel);
          if (state === 'live') {
            live.className = 'live-top';
            live.innerHTML = '<span class="dot"></span><span class="live-time">' + escapeHtml(t('live_now')) + '</span>';
          } else if (state === 'soon') {
            live.className = 'live-top';
            live.innerHTML = '<span class="live-time">' + escapeHtml(formatStartsAt(startsAt)) + '</span>';
          } else {
            live.className = 'live-top hidden';
            live.innerHTML = '';
          }
        });
      }
      setInterval(refreshLiveLabels, 60000);

      var WINDOW_FWD = 2;
      function getVideo(idx){
        if (idx < 0 || idx >= slides.length) return null;
        var c = slides[idx].querySelector('.video');
        return c ? c.querySelector('video') : null;
      }
      function rebuildVideoFor(idx, autoplay, prime){
        if (idx < 0 || idx >= slides.length) return null;
        var url = videoUrls[idx]; if (!url) return null;
        var container = slides[idx].querySelector('.video'); if (!container) return null;
        var old = container.querySelector('video');
        if (old) {
          if (prime && old.readyState < 2 && old.networkState !== 2) {
            try { var op = old.play(); if (op && op.then) op.then(function(){ try { old.pause(); old.currentTime = 0; } catch(e){} }).catch(function(){}); } catch(e){}
          }
          return old;
        }
        var v = document.createElement('video');
        v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline',''); v.setAttribute('loop',''); v.setAttribute('preload','auto');
        v.muted = true; v.src = url; v.dataset.src = url; container.appendChild(v);
        if (autoplay) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
        else if (prime) {
          try {
            var pp = v.play();
            if (pp && pp.then) pp.then(function(){ try { v.pause(); v.currentTime = 0; } catch(e){} }).catch(function(){});
            else { try { v.pause(); v.currentTime = 0; } catch(e){} }
          } catch(e){}
        }
        return v;
      }
      function setActiveSlide(idx){
        if (!slides.length) return;
        for (var i = 0; i < slides.length; i++) {
          var v0 = getVideo(i); if (!v0) continue;
          try { v0.muted = true; } catch(e){}
          if (i !== idx) { try { v0.pause(); } catch(e){} try { v0.currentTime = 0; } catch(e){} }
        }
        var cur = getVideo(idx);
        if (!cur) { rebuildVideoFor(idx, false, false); cur = getVideo(idx); }
        if (cur) {
          cur.muted = true;
          try { cur.currentTime = 0; } catch(e){}
          var p = cur.play();
          var unmute = function(){ if (!soundEnabled) return; try { cur.muted = false; cur.volume = 1; } catch(e){} };
          if (p && p.then) p.then(unmute).catch(function(){});
          else requestAnimationFrame(unmute);
        }
        for (var k = 1; k <= WINDOW_FWD; k++) { var ni = idx + k; if (ni < slides.length) rebuildVideoFor(ni, false, true); }
      }

      function layoutReels(){
        var vh = window.innerHeight;
        if (!vh || vh < 100) return;
        feed.style.height = vh + 'px';
        var all = feed.querySelectorAll('.slide');
        for (var i = 0; i < all.length; i++) all[i].style.height = vh + 'px';
      }

      function getStartParam(){
        try {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
            return window.Telegram.WebApp.initDataUnsafe.start_param || null;
          }
        } catch(e){}
        return null;
      }

      // === Sound ===
      var soundBtns = [];
      function bindSoundBtns(){
        soundBtns = feed.querySelectorAll('[data-sound-btn]');
        soundBtns.forEach(function(btn){
          if (btn.__bound) return;
          btn.__bound = true;
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            if (soundEnabled) disableSound(); else enableSound();
          });
        });
        updateIcons();
      }
      function updateIcons(){
        soundBtns.forEach(function(btn){
          var svg = btn.querySelector('svg'); if (!svg) return;
          if (soundEnabled) { btn.classList.add('on'); svg.innerHTML = '<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 7a7 7 0 0 1 0 10"/>'; }
          else { btn.classList.remove('on'); svg.innerHTML = '<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/>'; }
        });
      }
      function enableSound(){
        if (soundEnabled) return;
        haptic('light');
        soundEnabled = true; updateIcons();
        var v = getVideo(currentIndex);
        if (v) { var p = v.play(); var unmute = function(){ try { v.muted = false; v.volume = 1; } catch(e){} }; if (p && p.then) p.then(unmute).catch(function(){}); else unmute(); }
        trackEvent('sound_on', {});
      }
      function disableSound(){ if (!soundEnabled) return; haptic('light'); soundEnabled = false; updateIcons(); var v = getVideo(currentIndex); if (v) { try { v.muted = true; } catch(e){} } }

      function bindEnterVibeBtns(){
        document.querySelectorAll('[data-enter-vibe]').forEach(function(btn){
          if (btn.__bound) return;
          btn.__bound = true;
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            openDoor(btn.getAttribute('data-category'), btn.getAttribute('data-label'));
          });
        });
      }

      function bindShareBtns(){
        document.querySelectorAll('[data-share]').forEach(function(btn){
          if (btn.__bound) return;
          btn.__bound = true;
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            haptic('light');
            if (window.ym) { try { ym(113067752, 'reachGoal', 'share'); } catch(err){} }
            var slide = btn.closest('.slide');
            var id = slide ? slide.dataset.id : '';
            trackEvent('share', { slide_id: id });

            var url = TG_MINIAPP_URL;
            if (id) url += '?startapp=' + encodeURIComponent(id);

            if (window.Telegram && window.Telegram.WebApp) {
              try {
                var shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(t('share_text'));
                window.Telegram.WebApp.openTelegramLink(shareUrl);
                return;
              } catch(err){}
            }
            if (navigator.share) { navigator.share({ title: 'VETKA', text: t('share_text'), url: url }).catch(function(){ copyToClipboard(url).then(function(){ showToast('Ссылка скопирована'); }); }); }
            else { copyToClipboard(url).then(function(){ showToast('Ссылка скопирована'); }).catch(function(){ showToast('Не удалось скопировать'); }); }
          });
        });
      }

      async function subscribeToReel(reelId, vibeTitle, place){
        try {
          var user = await authReady; if (!user) return false;
          var tgUser = readTgUser();
          var tgId = tgUser ? String(tgUser.id) : null;
          if (!tgId) return false;
          if (!reelId) return false;

          await fetch(SUPABASE_URL + '/rest/v1/users?tg_id=eq.' + encodeURIComponent(tgId), {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
            body: JSON.stringify({ wants_notify: true })
          });

          var r = await fetch(SUPABASE_URL + '/rest/v1/subscriptions', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=ignore-duplicates,return=minimal' },
            body: JSON.stringify([{ user_id: user.id, tg_id: tgId, reel_id: reelId, vibe_title: vibeTitle || null, place: place || null }])
          });
          return r.ok;
        } catch(e) { console.warn('subscribeToReel error:', e); return false; }
      }

      async function unsubscribeFromReel(reelId){
        try {
          var user = await authReady; if (!user) return false;
          if (!reelId) return false;
          var r = await fetch(SUPABASE_URL + '/rest/v1/subscriptions?user_id=eq.' + encodeURIComponent(user.id) + '&reel_id=eq.' + encodeURIComponent(reelId), {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Prefer': 'return=minimal' }
          });
          return r.ok;
        } catch(e) { console.warn('unsubscribeFromReel error:', e); return false; }
      }

      function bindGoBtns(){
        document.querySelectorAll('[data-go]').forEach(function(btn){
          if (btn.__bound) return;
          btn.__bound = true;
          btn.addEventListener('click', async function(e){
            e.stopPropagation();
            if (btn.dataset.inflight === '1') return;

            var vibeSubId = btn.getAttribute('data-vibe-sub');
            var isSub = btn.dataset.subscribed === '1';

            haptic('medium');

            if (vibeSubId) {
              btn.dataset.inflight = '1';
              if (isSub) {
                var okVU = await unsubscribeFromReel(vibeSubId);
                btn.dataset.inflight = '0';
                if (okVU) {
                  delete mySubscribed[vibeSubId];
                  haptic('success');
                  showToast(t('vibe_unsub_ok'));
                  refreshSubscriptionUI();
                  trackEvent('unsubscribe_vibe', { vibe_reel_id: vibeSubId });
                } else { haptic('error'); showToast(t('go_error')); }
              } else {
                var vibeReel = currentVibe ? findVibeReel(currentVibe.category) : null;
                var okVS = await subscribeToReel(vibeSubId, vibeReel ? vibeReel.vibe_title : '', null);
                btn.dataset.inflight = '0';
                if (okVS) {
                  mySubscribed[vibeSubId] = true;
                  haptic('success');
                  showToast(t('vibe_ok_toast'));
                  refreshSubscriptionUI();
                  trackEvent('subscribe_vibe', { vibe_reel_id: vibeSubId });
                  if (window.ym) { try { ym(113067752, 'reachGoal', 'subscribe_vibe'); } catch(err){} }
                } else { haptic('error'); showToast(t('go_error')); }
              }
              return;
            }

            var ctaUrl = btn.getAttribute('data-cta-url') || '';
            var cta = String(ctaUrl).trim().toLowerCase();
            var reelId = btn.getAttribute('data-reel-id') || '';
            var vibeTitle = btn.getAttribute('data-vibe-title') || '';
            var place = btn.getAttribute('data-place') || '';

            if (cta && cta !== 'none' && !isSub) {
              trackEvent('go_click', { slide_id: reelId, has_url: true });
              if (window.ym) { try { ym(113067752, 'reachGoal', 'go_click'); } catch(err){} }
              try {
                if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openLink === 'function') {
                  window.Telegram.WebApp.openLink(ctaUrl);
                } else {
                  window.open(ctaUrl, '_blank', 'noopener,noreferrer');
                }
              } catch(e){ location.href = ctaUrl; }
              return;
            }

            btn.dataset.inflight = '1';
            var reel = findReelById(reelId) || { id: reelId, cta_url: ctaUrl, cta_label: null, vibe_title: vibeTitle, place: place };

            if (isSub) {
              var okU = await unsubscribeFromReel(reelId);
              btn.dataset.inflight = '0';
              if (okU) {
                delete mySubscribed[reelId];
                updateGoBtn(btn, reel, false);
                haptic('success');
                showToast(t('go_unsub_ok'));
                trackEvent('unsubscribe_reel', { slide_id: reelId });
              } else { haptic('error'); showToast(t('go_error')); }
            } else {
              trackEvent('go_click', { slide_id: reelId, has_url: false });
              if (window.ym) { try { ym(113067752, 'reachGoal', 'go_click'); } catch(err){} }
              var okS = await subscribeToReel(reelId, vibeTitle, place);
              btn.dataset.inflight = '0';
              if (okS) {
                mySubscribed[reelId] = true;
                updateGoBtn(btn, reel, true);
                haptic('success');
                showToast(t('go_ok_toast'));
                trackEvent('subscribe_reel', { slide_id: reelId });
                if (window.ym) { try { ym(113067752, 'reachGoal', 'subscribe_reel'); } catch(err){} }
              } else { haptic('error'); showToast(t('go_error')); }
            }
          });
        });
      }

      function bindHandlers(){
        bindSoundBtns();
        bindShareBtns();
        bindGoBtns();
        bindEnterVibeBtns();
      }

      var currentIO = null;
      function initIO(){
        if (currentIO) currentIO.disconnect();
        if (!feed) return;
        currentIO = new IntersectionObserver(function(entries){
          var best = null, bestRatio = 0;
          entries.forEach(function(e){ if (e.isIntersecting && e.intersectionRatio > bestRatio) { bestRatio = e.intersectionRatio; best = e.target; } });
          if (best && bestRatio > 0.55) {
            var idx = slides.indexOf(best);
            if (idx !== -1 && idx !== currentIndex) {
              haptic('light');
              flushDwell(currentIndex);
              currentIndex = idx;
              slideEnteredAt = Date.now();
              setActiveSlide(idx);
            }
          }
        }, { root: feed, threshold: [0.1, 0.55, 0.9] });
        slides.forEach(function(s){ currentIO.observe(s); });
      }

      var slideIO = null;
      function initSlideViewsIO(){
        if (slideIO) slideIO.disconnect();
        slideIO = new IntersectionObserver(function(entries){
          entries.forEach(function(e){
            if (e.isIntersecting && e.intersectionRatio > 0.5) {
              var slideId = e.target.dataset.id;
              if (slideId && !trackedSlideViews[slideId]) { trackedSlideViews[slideId] = true; trackEvent('slide_view', { slide_id: slideId }); }
            }
          });
        }, { root: feed, threshold: [0, 0.55, 0.9] });
        slides.forEach(function(s){ slideIO.observe(s); });
      }

      function copyToClipboard(text){
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
        return new Promise(function(resolve, reject){
          try {
            var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position = 'absolute'; ta.style.left = '-9999px';
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); resolve();
          } catch(e){ reject(e); }
        });
      }

      var STORAGE_KEY = EARLY_TG_ID ? 'sb-rlkjsjgktyltvxnfyski-auth-token-' + EARLY_TG_ID : 'sb-rlkjsjgktyltvxnfyski-auth-token';
      var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true, storageKey: STORAGE_KEY } });

      function readTgId(){ var u = readTgUser(); return u ? String(u.id) : null; }
      function getAnonId(){
        var key = EARLY_TG_ID ? 'vetka_anon_id_' + EARLY_TG_ID : 'vetka_anon_id';
        var id = null; try { id = localStorage.getItem(key); } catch(e){}
        if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : 'anon-' + Date.now()); try { localStorage.setItem(key, id); } catch(e){} }
        return id;
      }

      var authReady = (async function(){
        var hasStored = false; try { hasStored = !!localStorage.getItem(STORAGE_KEY); } catch(e){}
        if (hasStored) {
          for (var i = 0; i < 15; i++) {
            try { var s = await supabaseClient.auth.getSession(); if (s.data && s.data.session && s.data.session.user) return s.data.session.user; } catch(e){}
            await new Promise(function(r){ setTimeout(r, 200); });
          }
        }
        try { var r = await supabaseClient.auth.signInAnonymously(); if (r.error) return null; return r.data.user; }
        catch(e){ return null; }
      })();

      function startTgIdWatch(){
        if (tgIdWatchStarted) return;
        tgIdWatchStarted = true;
        var tries = 0;
        var iv = setInterval(function(){
          tries++;
          if (readTgId()) { clearInterval(iv); flushEvents(); }
          else if (tries >= 25) { clearInterval(iv); flushEvents(); }
        }, 200);
        setTimeout(flushEvents, 5200);
      }

      async function flushEvents(){
        if (flushing) return;
        if (pendingEvents.length === 0) return;
        flushing = true;
        var batch = pendingEvents.slice(); pendingEvents = [];
        try {
          var user = await authReady; if (!user) { flushing = false; return; }
          var tgId = readTgId(); var anonId = getAnonId();
          var rows = batch.map(function(e){ return { user_id: user.id, tg_id: tgId, anon_id: anonId, event_type: e.type, event_data: e.data, session_id: SESSION_ID }; });
          await supabaseClient.from('events').insert(rows);
        } catch(e){}
        flushing = false;
        if (pendingEvents.length > 0) flushEvents();
      }

      function scheduleFlush(){ if (flushTimer) return; flushTimer = setTimeout(function(){ flushTimer = null; flushEvents(); }, 1500); }
      function trackEvent(type, data){
        pendingEvents.push({ type: type, data: data || {} });
        if (readTgId()) scheduleFlush();
        else if (window.Telegram && window.Telegram.WebApp) startTgIdWatch();
        else scheduleFlush();
      }

      function flushDwell(idx){
        if (idx < 0 || idx >= slides.length) return;
        if (!slideEnteredAt) return;
        var dur = Date.now() - slideEnteredAt;
        slideEnteredAt = 0;
        if (dur < 500 || dur > 30 * 60 * 1000) return;
        var slideId = slides[idx].dataset.id;
        if (slideId) trackEvent('slide_dwell', { slide_id: slideId, duration_ms: dur });
      }

      document.addEventListener('visibilitychange', function(){
        if (document.hidden) { flushDwell(currentIndex); flushEvents(); }
        else { slideEnteredAt = Date.now(); }
      });
      window.addEventListener('pagehide', function(){ flushDwell(currentIndex); flushEvents(); });
      window.addEventListener('resize', layoutReels);

      retryBtn.addEventListener('click', function(){ haptic('medium'); location.reload(); });

      authReady.then(function(u){ if (!u) return; trackEvent('visit', { referrer: document.referrer || null, ua: navigator.userAgent }); });

      async function initApp(retryCount){
        retryCount = retryCount || 0;
        try {
          var deepId = getStartParam();
          if (deepId) {
            var reel = await loadReelById(deepId);
            if (reel) {
              try { await loadMySubscriptions(); } catch(e){}
              renderSingleReel(reel);
              loaded = true;
              return;
            }
          }

          var vibes = await loadVibeReels();
          if (!vibes) vibes = [];
          vibeReels = vibes;
          loaded = true;

          feed.classList.add('visible');
          layoutReels();

          renderVibesFeed(vibeReels, 0);
          loadMySubscriptions().then(function(){ refreshSubscriptionUI(); });
        } catch (err) {
          console.warn('initApp error:', err);
          if (retryCount < 3) {
            setTimeout(function(){ initApp(retryCount + 1); }, 1500 * (retryCount + 1));
          } else {
            showEmptyState('Не удалось загрузить', 'Проверьте соединение и попробуйте снова.', true);
          }
        }
      }

      initApp(0);

    })();
  </script>
