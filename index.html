      function releaseVideo(v){
        if (!v) return;

      function loadVideo(v, url, mode){
        if (!v || !url) return;
        if (!v.getAttribute('src') || v.dataset.currentSrc !== url) {
          v.dataset.currentSrc = url;
          v.src = url;
          v.setAttribute('preload', mode === 'play' ? 'auto' : 'metadata');
          try { v.load(); } catch(e){}
        } else {
          v.setAttribute('preload', mode === 'play' ? 'auto' : 'metadata');
        }
        if (mode === 'play') {
          v.muted = true;
          var p = v.play();
          if (p && p.catch) p.catch(function(){});
        }

          if (i === idx) {
            try { v.muted = true; } catch(e){}
            loadVideo(v, url, 'play');

            var p = v.play();
            var unmute = function(){ if (!soundEnabled) return; try { v.muted = false; v.volume = 1; } catch(e){} };
            if (p && p.then) p.then(unmute).catch(function(){});

          } else {
            releaseVideo(v);
          }
        }
      }

      function layoutReels(){
        var vh = window.innerHeight;
        if (!vh || vh < 100) return;
        feed.style.height = vh + 'px';
        var all = feed.querySelectorAll('.slide');
        for (var i = 0; i < all.length; i++) all[i].style.height = vh + 'px';
      }

      function getStartParam(){
        try {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
            return window.Telegram.WebApp.initDataUnsafe.start_param || null;
          }
        } catch(e){}
        return null;
      }

      function dismissOnboarding(){
        if (!onboarding || onboardingClosing) return;
        unlockAudio();
        onboardingClosing = true;
        onboarding.style.transform = '';
        onboarding.classList.add('gone');

        var onbVids = onboarding.querySelectorAll('video');
        for (var i = 0; i < onbVids.length; i++) {
          try { onbVids[i].muted = true; } catch(e){}
          try { onbVids[i].pause(); } catch(e){}
          try { onbVids[i].removeAttribute('src'); onbVids[i].load(); } catch(e){}
        }
        if (onbIO) { try { onbIO.disconnect(); } catch(e){} onbIO = null; }

        onboardingDismissed = true;
        layoutReels();
        slideEnteredAt = Date.now();
        feed.classList.add('visible');
        postOnboardingBoot();
        setTimeout(function(){
          if (onboarding && onboarding.parentNode) onboarding.parentNode.removeChild(onboarding);
          onboarding = null;
        }, 600);
      }

      // === ОНБОРДИНГ: preview_url + loop + viewport-загрузка ===
      var onbIO = null;

      function onbLoadVideo(v){
        if (!v || v.__loaded) return;
        var url = v.dataset.src;
        if (!url) return;
        v.__loaded = true;
        v.muted = true;
        v.setAttribute('muted','');
        v.setAttribute('playsinline','');
        v.setAttribute('webkit-playsinline','');
        v.setAttribute('preload','auto');
        v.setAttribute('loop','');  // настоящий loop — файл уже 3 сек
        v.src = url;
        try { v.load(); } catch(e){}
        v.addEventListener('loadeddata', function(){
          try { v.play().catch(function(){}); } catch(e){}
          v.classList.add('loaded');
        }, { once: true });
        var p = v.play();
        if (p && p.catch) p.catch(function(){});
      }

      function onbReleaseVideo(v){
        if (!v || !v.__loaded) return;
        try { v.pause(); } catch(e){}
        try { v.removeAttribute('src'); v.load(); } catch(e){}
        v.classList.remove('loaded');
        v.__loaded = false;
      }

      function initOnboardingVideos(){
        if (!onboarding) return;
        var allVids = Array.prototype.slice.call(onboarding.querySelectorAll('video'));

        if ('IntersectionObserver' in window) {
          onbIO = new IntersectionObserver(function(entries){
            entries.forEach(function(entry){
              var v = entry.target;
              if (entry.isIntersecting) {
                onbLoadVideo(v);
              } else if (entry.intersectionRatio === 0) {
                onbReleaseVideo(v);
              }
            });
          }, {
            root: onboarding,
            rootMargin: '600px 0px 600px 0px',  // файлы лёгкие — грузим с запасом
            threshold: [0, 0.01]
          });
          allVids.forEach(function(v){ onbIO.observe(v); });
        } else {
          [0,1,2,6,7,8].forEach(function(i){
            if (allVids[i]) onbLoadVideo(allVids[i]);
          });
        }
      }

      if (onboarding) {
        onboarding.classList.add('ready');

        var startY = 0, currentY = 0, dragging = false, moved = false;
        var THRESHOLD = 60;

        function onStart(e){
          unlockAudio();
          var pt = e.touches ? e.touches[0] : e;
          startY = pt.clientY; currentY = startY;
          dragging = true; moved = false;
          onboarding.classList.add('dragging');
        }
        function onMove(e){
          if (!dragging) return;
          var pt = e.touches ? e.touches[0] : e;
          currentY = pt.clientY;
          var delta = currentY - startY;
          if (Math.abs(delta) > 6) moved = true;
          if (delta < 0) {
            onboarding.style.transform = 'translateY(' + delta + 'px)';
            if (e.cancelable) e.preventDefault();
          }
        }
        function onEnd(){
          if (!dragging) return;
          dragging = false;
          onboarding.classList.remove('dragging');
          var delta = currentY - startY;
          if (delta < -THRESHOLD) dismissOnboarding();
          else onboarding.style.transform = '';
        }

        onboarding.addEventListener('touchstart', onStart, {passive:true});
        onboarding.addEventListener('touchmove', onMove, {passive:false});
        onboarding.addEventListener('touchend', onEnd);
        onboarding.addEventListener('touchcancel', onEnd);
        onboarding.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);

        onboarding.addEventListener('click', function(e){
          unlockAudio();
          if (e.target.closest('.lang-switch')) return;
          if (moved) return;
          dismissOnboarding();
        });

        // Загружаем preview_url || video_url
        (function loadOnbFromSupabase(attempt){
          attempt = attempt || 1;
          api('reels', 'select=preview_url,video_url&is_active=eq.true&order=sort_order.asc&limit=12')
            .then(function(rows){
              if (!onboarding) return;
              try {
                var seen = {}, urls = [];
                if (rows && rows.length) {
                  for (var i = 0; i < rows.length; i++) {
                    var u = (rows[i] && (rows[i].preview_url || rows[i].video_url));
                    if (u && !seen[u]) { seen[u] = 1; urls.push(u); }
                  }
                }
                if (!urls.length) {
                  if (attempt < 5) return setTimeout(function(){ loadOnbFromSupabase(attempt + 1); }, 500 * attempt);
                  return;
                }

                var onbVids = Array.prototype.slice.call(onboarding.querySelectorAll('video'));
                var n = urls.length, left = [], right = [];
                if (n >= 6) {
                  left = [urls[0], urls[1], urls[2], urls[0], urls[1], urls[2]];
                  right = [urls[3], urls[4], urls[5], urls[3], urls[4], urls[5]];
                } else if (n === 5) {
                  left = [urls[0], urls[1], urls[2], urls[0], urls[1], urls[2]];
                  right = [urls[3], urls[4], urls[3], urls[4], urls[3], urls[4]];
                } else if (n === 4) {
                  left = [urls[0], urls[1], urls[0], urls[1], urls[0], urls[1]];
                  right = [urls[2], urls[3], urls[2], urls[3], urls[2], urls[3]];
                } else if (n === 3) {
                  left = [urls[0], urls[1], urls[2], urls[0], urls[1], urls[2]];
                  right = [urls[1], urls[2], urls[0], urls[1], urls[2], urls[0]];
                } else if (n === 2) {
                  left = [urls[0], urls[1], urls[0], urls[1], urls[0], urls[1]];
                  right = [urls[1], urls[0], urls[1], urls[0], urls[1], urls[0]];
                } else {
                  left = [urls[0], urls[0], urls[0], urls[0], urls[0], urls[0]];
                  right = [urls[0], urls[0], urls[0], urls[0], urls[0], urls[0]];
                }

                if (onbVids.length >= 12) {
                  for (var j = 0; j < 6; j++) {
                    onbVids[j].dataset.src = left[j];
                    onbVids[j + 6].dataset.src = right[j];
                  }
                  initOnboardingVideos();
                }
              } catch(err){}
            })
            .catch(function(){
              if (attempt < 5) return setTimeout(function(){ loadOnbFromSupabase(attempt + 1); }, 500 * attempt);
            });
        })();

        var langBtns = document.querySelectorAll('[data-lang]');
        for (var li = 0; li < langBtns.length; li++) {
          (function(b){
            b.addEventListener('click', function(e){ e.stopPropagation(); applyLang(b.getAttribute('data-lang')); });
            b.addEventListener('touchstart', function(e){ e.stopPropagation(); }, {passive:true});
            b.addEventListener('touchend', function(e){ e.stopPropagation(); });
          })(langBtns[li]);
        }
      } else {
        onboardingDismissed = true;
        feed.classList.add('visible');
      }

      applyLang(currentLang);

      if (vibeBackBtn) {
        vibeBackBtn.addEventListener('click', function(e){
          e.stopPropagation();

      var soundBtns = [];

        });

      function enableSound(){
