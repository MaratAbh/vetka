<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07070a">
<title>VETKA — logo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:#07070a;
    color:#fff;
    height:100%;
    width:100%;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    font-family:'Unbounded',sans-serif;
  }
  .stage{
    height:100vh;
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:36px;
    padding:40px;
  }
  .mark{
    width:140px;
    height:140px;
    color:#fff;
    flex:none;
  }
  .mark svg{
    width:100%;
    height:100%;
    display:block;
  }
  .logo{
    font-family:'Unbounded',sans-serif;
    font-weight:500;
    font-size:clamp(96px, 20vw, 180px);
    line-height:.94;
    letter-spacing:-.045em;
    color:#fff;
    text-shadow:0 8px 64px rgba(0,0,0,.7);
    user-select:none;
  }
  .logo em{
    font-style:normal;
    color:#CDFF4A;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="mark">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 39V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M20 27C12.5 25.2 8 19.4 8 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M20 21C27.5 19.2 32 13.4 32 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="8" cy="11" r="2.1" fill="#CDFF4A"/>
        <circle cx="32" cy="5" r="2.1" fill="#CDFF4A"/>
        <circle cx="20" cy="13" r="2.1" fill="#CDFF4A"/>
      </svg>
    </div>
    <div class="logo">VETKA<em>.</em></div>
  </div>
</body>
</html>
